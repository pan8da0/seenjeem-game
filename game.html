<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-i18n="appName">اشتباك</title>
<meta name="theme-color" content="#0A0E1B">
<link rel="icon" href="images/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/game.css">
</head>
<body>
<div class="game-shell">

  <header class="game-topbar">
    <button type="button" class="icon-btn" id="btn-go-home" data-icon="chevron" data-icon-flip aria-label="Home" data-i18n-aria-label="home"></button>
    <div class="game-topbar-brand">
      <span data-i18n="appName">اشتباك</span>
    </div>
    <div class="game-topbar-actions">
      <div class="lang-switch lang-switch--sm" id="lang-switch">
        <button type="button" data-lang="ar">ع</button>
        <button type="button" data-lang="en">EN</button>
      </div>
      <button type="button" class="icon-btn" id="btn-game-settings" data-icon="settings" aria-label="Settings" data-i18n-aria-label="settings"></button>
    </div>
  </header>

  <main class="game-main">

    <!-- Team setup -->
    <section class="view team-setup" id="view-teams" hidden>
      <div class="container container--narrow">
        <h2 data-i18n="teamSetupTitle">أدخل أسماء الفريقين</h2>
        <p class="muted" data-i18n="teamSetupSubtitle">كل لعبة تُلعب بين فريقين اثنين فقط</p>

        <div class="team-setup-grid">
          <div class="field team-field team-field--1">
            <label for="input-team1" data-i18n="team1Label">اسم الفريق الأول</label>
            <input type="text" class="input" id="input-team1" maxlength="24" data-i18n-placeholder="teamNamePlaceholder">
          </div>
          <div class="team-vs-badge">VS</div>
          <div class="field team-field team-field--2">
            <label for="input-team2" data-i18n="team2Label">اسم الفريق الثاني</label>
            <input type="text" class="input" id="input-team2" maxlength="24" data-i18n-placeholder="teamNamePlaceholder">
          </div>
        </div>

        <button type="button" class="btn btn--primary btn--xl btn--full" id="btn-teams-next" data-i18n="next">التالي</button>
      </div>
    </section>

    <!-- Category selection -->
    <section class="view categories-view" id="view-categories" hidden>
      <div class="container">
        <h2 data-i18n="categoriesTitle">اختر الفئات</h2>
        <p class="muted" data-i18n="categoriesSubtitle">اختر فئات هذه الجولة</p>

        <div class="categories-toolbar">
          <div class="search-box">
            <span data-icon="search" data-icon-size="18"></span>
            <input type="text" class="input" id="category-search" data-i18n-placeholder="searchPlaceholder">
          </div>
          <div class="selected-count-badge badge" id="selected-count-badge"></div>
        </div>

        <div class="categories-grid" id="categories-grid"></div>
      </div>

      <div class="categories-footer">
        <div class="container">
          <button type="button" class="btn btn--accent btn--xl btn--full" id="btn-start-game" data-i18n="startGame" disabled>ابدأ اللعبة</button>
        </div>
      </div>
    </section>

    <!-- Board -->
    <section class="view board-view" id="view-board" hidden>
      <div class="container">
        <div class="scoreboard">
          <div class="team-score team-score--1">
            <div class="team-score-name" id="board-team1-name"></div>
            <div class="team-score-points" id="board-team1-points"></div>
          </div>
          <div class="vs-badge">VS</div>
          <div class="team-score team-score--2">
            <div class="team-score-name" id="board-team2-name"></div>
            <div class="team-score-points" id="board-team2-points"></div>
          </div>
        </div>

        <div class="board-toolbar">
          <button type="button" class="btn btn--ghost btn--sm" id="btn-end-game-early" data-i18n="endGameEarly">إنهاء اللعبة</button>
        </div>

        <div class="board-categories" id="board-categories"></div>
      </div>
    </section>

    <!-- Question -->
    <section class="view question-view" id="view-question" hidden>
      <div class="container container--narrow">
        <div class="question-topline">
          <span class="question-category-badge">
            <span id="question-category-icon"></span>
            <span id="question-category-name"></span>
          </span>
          <span class="question-points-badge">
            <span id="question-points-value"></span> <span data-i18n="points">نقطة</span>
          </span>
        </div>

        <div class="question-timer">
          <svg class="timer-ring" viewBox="0 0 120 120" aria-hidden="true">
            <circle class="timer-ring-track" cx="60" cy="60" r="54"></circle>
            <circle class="timer-ring-progress" id="timer-ring-progress" cx="60" cy="60" r="54"></circle>
          </svg>
          <div class="timer-number" id="timer-number">30</div>
          <div class="timer-status-label" id="timer-status-label" data-i18n="timeUp" hidden></div>
        </div>

        <button type="button" class="btn btn--secondary timer-toggle-btn" id="btn-timer-toggle"></button>

        <div class="question-body card">
          <p class="question-text" id="question-text"></p>
          <img class="question-image" id="question-image" alt="" hidden>
        </div>

        <div class="question-actions" id="question-actions-reveal">
          <button type="button" class="btn btn--accent btn--xl btn--full" id="btn-reveal-answer" data-i18n="revealAnswer">إظهار الإجابة</button>
        </div>

        <div class="question-answer-block" id="question-answer-block" hidden>
          <div class="answer-card card">
            <div class="answer-label" data-i18n="answerLabel">الإجابة</div>
            <div class="answer-text" id="answer-text"></div>
          </div>
          <p class="who-answered-label" data-i18n="whoAnswered">من أجاب بشكل صحيح؟</p>
          <div class="scoring-buttons">
            <button type="button" class="btn btn--lg btn--team1 btn--full" id="btn-score-team1"></button>
            <button type="button" class="btn btn--lg btn--team2 btn--full" id="btn-score-team2"></button>
            <button type="button" class="btn btn--lg btn--secondary btn--full" id="btn-score-none" data-i18n="scoreNoOne">لا أحد</button>
          </div>
        </div>
      </div>
    </section>

    <!-- Winner -->
    <section class="view winner-view" id="view-winner" hidden>
      <div class="container container--narrow">
        <div class="winner-trophy" data-icon="trophy" data-icon-size="56"></div>
        <h2 class="winner-title" id="winner-title"></h2>
        <div class="winner-team-name" id="winner-team-name"></div>
        <div class="winner-team-points" id="winner-team-points"></div>
        <div class="winner-other-score" id="winner-other-score"></div>
        <div class="btn-row winner-actions">
          <button type="button" class="btn btn--primary btn--lg" id="btn-play-again" data-i18n="playAgain">العب مرة أخرى</button>
          <button type="button" class="btn btn--secondary btn--lg" id="btn-winner-new-game" data-i18n="newGame">لعبة جديدة</button>
          <button type="button" class="btn btn--ghost btn--lg" id="btn-winner-home" data-i18n="home">الرئيسية</button>
        </div>
      </div>
    </section>

  </main>
</div>

<!-- Settings modal (shared component, same as home page) -->
<div class="modal-overlay" id="modal-settings" hidden>
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <button type="button" class="icon-btn modal-close" data-close-modal="modal-settings" data-icon="close" data-icon-size="18" aria-label="Close" data-i18n-aria-label="close"></button>
    <h3 class="modal-title" id="settings-title" data-i18n="settingsTitle">الإعدادات</h3>

    <div class="settings-group">
      <label class="settings-label" data-i18n="settingsTimer">مدة السؤال</label>
      <div class="chip-row" id="settings-timer-chips"></div>
    </div>

    <div class="settings-group">
      <label class="settings-label" data-i18n="settingsCategoriesPerGame">عدد الفئات في اللعبة</label>
      <div class="chip-row" id="settings-categories-chips"></div>
    </div>

    <div class="settings-group">
      <div class="toggle-row">
        <label class="settings-label" for="settings-sound-toggle" data-i18n="settingsSound">المؤثرات الصوتية</label>
        <label class="switch">
          <input type="checkbox" id="settings-sound-toggle">
          <span class="switch-track"></span>
          <span class="switch-thumb"></span>
        </label>
      </div>
    </div>

    <div class="settings-group">
      <label class="settings-label" data-i18n="settingsLanguage">اللغة</label>
      <div class="chip-row" id="settings-language-chips">
        <button type="button" class="chip" data-settings-lang="ar" data-i18n="langSwitchAr">العربية</button>
        <button type="button" class="chip" data-settings-lang="en" data-i18n="langSwitchEn">English</button>
      </div>
    </div>

    <div class="modal-actions">
      <button type="button" class="btn btn--primary btn--full" data-close-modal="modal-settings" data-i18n="save">حفظ</button>
    </div>
  </div>
</div>

<script src="js/core/storage.js"></script>
<script src="js/core/translations.js"></script>
<script src="js/core/i18n.js"></script>
<script src="js/core/icons.js"></script>
<script src="js/core/audio.js"></script>
<script src="js/core/ui.js"></script>
<script src="js/core/gameEngine.js"></script>
<script src="data/categories.js"></script>
<script src="data/questions/football.js"></script>
<script src="data/questions/capitals.js"></script>
<script src="data/questions/history.js"></script>
<script src="data/questions/geography.js"></script>
<script src="data/questions/islamic.js"></script>
<script src="data/questions/quran.js"></script>
<script src="data/questions/prophet_biography.js"></script>
<script src="data/questions/companions.js"></script>
<script src="data/questions/science.js"></script>
<script src="data/questions/human_body.js"></script>
<script src="data/questions/space.js"></script>
<script src="data/questions/animals.js"></script>
<script src="data/questions/technology.js"></script>
<script src="data/questions/inventions.js"></script>
<script src="data/questions/arab_cities.js"></script>
<script src="data/questions/food.js"></script>
<script src="data/questions/general_knowledge.js"></script>
<script src="data/questions/riddles.js"></script>
<script src="data/questions/landmarks.js"></script>
<script src="data/questions/civilizations.js"></script>
<script src="data/questions/sports_general.js"></script>
<script src="js/core/catalog.js"></script>
<script src="js/pages/game.js"></script>
</body>
</html>
